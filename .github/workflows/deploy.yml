# OnDex — CI/CD va xavfsizlik quvuri.
#
# Bosqichlar (har biri oldingisidan o'tishini kutadi):
#   0. Gitleaks     — tarixda sir bormi
#   1. Go sifati    — build, vet, test -race, govulncheck
#   2. Semgrep      — SAST (statik tahlil)
#   3. Build+Trivy  — image yig'ish va zaiflik skanerlash
#   4. OWASP ZAP    — DAST (ishlab turgan serverga hujum simulyatsiyasi)
#   5. Deploy       — VPS (sozlanmagan bo'lsa JIMGINA o'tkazib yuboriladi)

name: CI/CD Pipeline - OnDex Backend

on:
  push:
    branches: [ main ]
    # ┌─ FLUTTER ILOVALARI BU QUVURNI ISHGA TUSHIRMAYDI ────────────────┐
    # Bu quvur backend (Go) va `apps/web` ni quradi hamda VPS'ga
    # deploy qiladi (`docker compose pull api web`). Flutter ilovalari
    # esa Play Store va Shorebird orqali tarqatiladi — ular bu
    # deploy'ga UMUMAN kirmaydi.
    #
    # Filtrsiz holatda mobil ilovadagi bitta qator o'zgarishi ham
    # butun quvurni (gitleaks -> Go testlari -> Semgrep -> image ->
    # ZAP -> deploy) yugurtirardi va production'ni qayta deploy
    # qilardi. Bu ~20 daqiqa runner vaqti va prod'ga keraksiz tegish.
    #
    # DIQQAT: `apps/web` ro'yxatda YO'Q va bo'lmasligi kerak — u shu
    # quvur bilan deploy qilinadi. Uni bu yerga qo'shish veb
    # o'zgarishlarining jonli serverga chiqmasligiga olib kelardi.
    #
    # `pull_request` da filtr ATAYLAB yo'q: PR'da deploy bo'lmaydi
    # (`if: github.event_name != 'pull_request'`), lekin gitleaks
    # har bir PR'ni tekshirishi kerak — sir qaysi papkada qolib
    # ketishidan qat'i nazar.
    # └─────────────────────────────────────────────────────────────────┘
    paths-ignore:
      - 'apps/customer_app/**'
      - 'apps/courier_app/**'
      - 'apps/admin_panel/**'
      - 'apps/restaurant_panel/**'
      - 'apps/waiter_app/**'
      - 'packages/ondex_core/**'
      - 'image/**'
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Har kuni: yangi e'lon qilingan CVE'lar kod o'zgarmasa ham topilsin.
  schedule:
    - cron: '0 0 * * *'

# ┌─ ENG KAM HUQUQ ────────────────────────────────────────────────────┐
# Standart holatda GITHUB_TOKEN ko'p narsaga yozish huquqiga ega.
# Bu yerda hamma narsa `read` ga tushiriladi va kerakli job o'ziga
# kerakligini ALOHIDA so'raydi. Buzilgan bog'liqlik (action) repoga
# yoza olmaydi.
# └────────────────────────────────────────────────────────────────────┘
permissions:
  contents: read

# Bir branchga ketma-ket push bo'lsa, eskisi bekor qilinadi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ondex-api

jobs:

  # ══════════════════════════════════════════════════════════════════
  # 0. Sirlar — Gitleaks
  # ══════════════════════════════════════════════════════════════════
  gitleaks_scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    # ┌─ `pull-requests: read` NEGA KERAK ────────────────────────────┐
    # Gitleaks PR kontekstida ishlaganda AVVAL shu PR'ning
    # commitlari ro'yxatini so'raydi (`GET /pulls/{n}/commits`) —
    # butun tarixni emas, faqat PR oralig'ini skanerlash uchun.
    #
    # Yuqoridagi global `permissions: contents: read` qolgan HAMMA
    # huquqni `none` ga tushiradi, shuning uchun o'sha so'rov
    # 403 "Resource not accessible by integration" bilan qaytardi va
    # job YIQILARDI. Javob header'i sababni aniq aytgan edi:
    # `x-accepted-github-permissions: pull_requests=read`.
    #
    # Natijada HAR BIR Dependabot PR'i qizil bo'lib turardi — sir
    # topilgani uchun EMAS, skaner ishga tusha olmagani uchun.
    # Bu eng yomon nosozlik turi: xavfsizlik darvozasi ishlayotgandek
    # ko'rinadi, aslida esa umuman ishlamaydi.
    #
    # `read` — yozish emas: gitleaks PR'ga izoh qoldirmaydi.
    # └───────────────────────────────────────────────────────────────┘
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # fetch-depth: 0 — BUTUN tarix. Sir bir marta commit qilinib
          # keyin o'chirilgan bo'lsa, u faqat tarixda qoladi va sayoz
          # klonda KO'RINMAYDI.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════
  # 1. Go sifati — build, vet, test, rasmiy zaiflik bazasi
  # ══════════════════════════════════════════════════════════════════
  go_quality:
    name: Go - Test & Vulnerabilities
    runs-on: ubuntu-latest
    needs: gitleaks_scan

    # ┌─ PRODUCTION OMBOR QATLAMINI CI'GA ULASH (bug.md 102-band) ──────┐
    # Bu blok bo'lmaganda `go test ./...` yashil bo'lsa ham u
    # PRODUCTION'DA ISHLAYDIGAN KODDAN BOSHQA kodni tasdiqlardi:
    # `internal/storage` dagi 12 ta production implementatsiyasining
    # BIRORTASI ham ishga tushmasdi, barcha testlar `NewMemory*`
    # nusxasida ishlardi.
    #
    # Yozilgan integratsiya testlari (342 qator) `t.Skip` bilan
    # JIMGINA o'tkazib yuborilardi — ya'ni ular faqat o'zgaruvchini
    # qo'lda bergan ishlab chiquvchining mashinasida ishlardi.
    # Eng qimmatlisi `TestProximityPostgres`: u PostGIS so'rovining
    # O'ZINI sinaydi (`ST_MakePoint(lng, lat)` tartibi almashsa
    # nuqta Hindiston okeaniga tushadi va HECH KIM topilmaydi) —
    # bunday xatoni xotiradagi repo printsipial jihatdan tuta olmaydi.
    #
    # `postgis/postgis` obrazi ATAYLAB: oddiy `postgres` obrazida
    # PostGIS kengaytmasi yo'q va migratsiya `CREATE EXTENSION` da
    # yiqilardi.
    # └─────────────────────────────────────────────────────────────────┘
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chust
          POSTGRES_PASSWORD: chust
          POSTGRES_DB: chustapp_test
        ports: [ '5432:5432' ]
        # Testlar baza TAYYOR bo'lgandan keyin boshlansin — aks holda
        # ular "connection refused" bilan yiqilardi va sabab
        # tushunarsiz bo'lardi.
        options: >-
          --health-cmd "pg_isready -U chust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ┌─ NEGA `go-version-file: go.mod` EMAS ─────────────────────────┐
      # U go.mod dagi versiyani AYNAN o'rnatadi. `go 1.25.0` turganida
      # CI 1.25 ning eng birinchi relizini olardi va `govulncheck`
      # standart kutubxonada 23 ta CVE topardi (crypto/tls, crypto/x509,
      # net/url, net/http) — bog'liqliklarimizda emas, Go'ning O'ZIDA.
      #
      # `1.25.x` + `check-latest` — har doim eng yangi 1.25 patchi.
      # Yangi CVE chiqib patch relizi berilganda quvur O'ZI tuzaladi,
      # qo'lda go.mod tahrirlash kerak bo'lmaydi.
      # └───────────────────────────────────────────────────────────────┘
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # ┌─ NEGA -race MUHIM ────────────────────────────────────────────┐
      # Poyga detektori gcc talab qiladi va ishlab chiqish mashinasida
      # (Windows) mavjud emas edi — ya'ni testlar u yerda poygani
      # UMUMAN tekshirmaydi. Bu kod WebSocket hub'i, dispatch to'lqini
      # va rate limiter kabi og'ir konkurrent qismlarga ega, ularda
      # poyga faqat yuk ostida namoyon bo'ladi.
      # Linux runner'da gcc bor — shuning uchun bu YAGONA joy.
      # └───────────────────────────────────────────────────────────────┘
      - name: Test (race detector)
        # ┌─ O'ZGARUVCHILAR SHU YERDA (bug.md 102-band) ──────────────┐
        # Ular berilmasa integratsiya testlari `t.Skip` qiladi va
        # quvur yashil bo'lib qolaveradi — aynan shu holat oylab
        # davom etgan edi. Nomlar testlar kutgani bilan AYNAN bir
        # xil bo'lishi shart:
        #   TEST_DATABASE_URL → internal/storage/courier_geo_test.go
        #   REDIS_ADDR        → internal/telegram/pending_persist_test.go
        #
        # `CI` — GitHub Actions uni o'zi qo'yadi. Testlar unga qarab
        # "o'tkazib yuborish" o'rniga YIQILADI: kelajakda kimdir
        # yuqoridagi `services:` blokini olib tashlasa, xato jim
        # qolmasin.
        # └───────────────────────────────────────────────────────────┘
        env:
          TEST_DATABASE_URL: postgres://chust:chust@localhost:5432/chustapp_test?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: go test -race -count=1 ./...

      # Rasmiy Go zaiflik bazasi. Trivy'dan farqi: u faqat siz
      # HAQIQATAN chaqiradigan funksiyalarni tekshiradi, ya'ni
      # ishlatilmaydigan koddagi CVE bo'yicha bezovta qilmaydi.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ══════════════════════════════════════════════════════════════════
  # 2. SAST — Semgrep
  # ══════════════════════════════════════════════════════════════════
  semgrep_sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep

      # `p/javascript` va `p/nodejs` o'rniga `p/golang` — backend Go'da.
      # `p/dockerfile` va `p/github-actions` qo'shildi: image va shu
      # quvurning o'zi ham hujum yuzasi.
      - name: Run Semgrep Full Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/golang \
            --config=p/dockerfile \
            --config=p/github-actions \
            --sarif \
            --output=semgrep.sarif \
            --metrics=off \
            . || true

      - name: Check for Critical Issues
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "Kritik xavfsizlik muammolari: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Kritik zaiflik topildi — quvur to'xtatildi"
            jq -r '.runs[].results[] | select(.level == "error")
                   | "  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"' \
                   semgrep.sarif
            exit 1
          fi

      - name: Upload Report to GitHub Security
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════
  # 3. Docker image — yig'ish, skanerlash, GHCR ga yuborish
  # ══════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ go_quality, semgrep_sast ]
    # ┌─ PR'LARDA ISHLAMAYDI — IKKI SABAB ────────────────────────────┐
    #  1. Dependabot PR'larida `GITHUB_TOKEN` FAQAT O'QISH huquqiga
    #     ega bo'ladi (GitHub'ning ataylab qo'ygan himoyasi: buzilgan
    #     bog'liqlik PR ochib, registry'ga yozib yubormasin). Ya'ni
    #     `packages: write` ishlamaydi va bu job HAR BIR Dependabot
    #     PR'ida ANIQ yiqilardi — o'nlab yolg'on qizil xoch.
    #  2. PR'dagi kod hali ko'rib chiqilmagan; undan image qurib
    #     registry'ga yuborishning ma'nosi yo'q.
    #
    # PR'larda tekshiruvlar (gitleaks, testlar, Semgrep) ishlaydi —
    # xavfsizlik nazorati yo'qolmaydi, faqat og'ir bosqichlar
    # o'tkazib yuboriladi.
    # └───────────────────────────────────────────────────────────────┘
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      # GHCR ga yozish uchun. Shaxsiy PAT O'RNIGA — bu token faqat shu
      # ishlash davomida amal qiladi va avtomatik bekor bo'ladi.
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR FAQAT kichik harfli nomlarni qabul qiladi, GitHub
      # foydalanuvchi nomi esa katta harfli bo'lishi mumkin
      # (Shoxake17). Buni oldindan kichik harfga o'tkazamiz — aks
      # holda push "invalid reference format" bilan sinadi.
      - name: Compute image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ┌─ Dockerfile'ning O'ZIDAGI xatolar ────────────────────────────┐
      # root ostida ishlash, yozib bo'ladigan fayl tizimi, `latest`
      # baza tegi — bularni image skaneri emas, konfiguratsiya skaneri
      # topadi.
      # └───────────────────────────────────────────────────────────────┘
      - name: Trivy - Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # ┌─ NEGA exit-code 1 ────────────────────────────────────────────┐
      # `exit-code: 0` bilan skaner natijani chiroyli chop etadi-yu,
      # quvurni HECH QACHON to'xtatmaydi — ya'ni bezak bo'lib qoladi.
      # `ignore-unfixed` — tuzatilishi hali chiqmagan CVE uchun qurish
      # to'xtatilmaydi (ular bo'yicha qiladigan ish yo'q).
      # └───────────────────────────────────────────────────────────────┘
      - name: Trivy - Image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      # Image DAST bosqichiga uzatiladi (GHCR ga hali yuborilmaydi:
      # avval ZAP tekshirsin).
      - name: Save image for DAST
        run: docker save "${{ steps.meta.outputs.image }}:${{ github.sha }}" -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════
  # 3b. Next.js image — yig'ish, skanerlash, GHCR ga yuborish
  # ══════════════════════════════════════════════════════════════════
  #
  # ┌─ NEGA API'DAN ALOHIDA ────────────────────────────────────────────┐
  # `NEXT_PUBLIC_*` qiymatlari BUILD vaqtida klient paketiga
  # singdiriladi (apps/web/Dockerfile izohiga qarang). Ya'ni image
  # DOMENGA BOG'LIQ bo'ladi va uni ishlash vaqtida o'zgartirib
  # bo'lmaydi.
  #
  # Domenlar GitHub Variables'dan olinadi (sir emas, oddiy sozlama):
  #   Settings -> Secrets and variables -> Actions -> Variables
  #     WEB_DOMAIN = web-ondex.shoxpro.uz
  #     API_DOMAIN = api-ondex.shoxpro.uz
  # Sozlanmasa pastdagi zaxira qiymatlar ishlatiladi.
  #
  # DAST'ga uzatilmaydi: ZAP Go API'ni sinaydi, Next.js esa uning
  # oldidagi qatlam — uni alohida sinash boshqa vazifa.
  # └───────────────────────────────────────────────────────────────────┘
  build-web:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    needs: [ go_quality, semgrep_sast ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/ondex-web" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # ┌─ UCHTA JOY BIR VAQTDA (bug.md 52, 66, 67-bandlar) ──────┐
          # Har bir `NEXT_PUBLIC_*` o'zgaruvchisi UCH joyda bo'lishi
          # SHART: kod, `apps/web/Dockerfile` (`ARG`+`ENV`) va shu
          # ro'yxat. Bittasi unutilsa xato JIMGINA bo'ladi — zaxira
          # qiymat ishlatiladi va hech qanday ogohlantirish chiqmaydi.
          #
          # Aynan shu sababdan `NEXT_PUBLIC_WS_URL` (Dockerfile'da
          # `ARG` bor edi, bu ro'yxatda yo'q) paketga
          # `ws://localhost:8080` bo'lib singib qolgandi va prod'da
          # kuryerning jonli joylashuvi HECH QACHON ko'rinmasdi.
          # `NEXT_PUBLIC_MEDIA_ORIGIN` esa ikkala joyda ham yo'q edi.
          # └─────────────────────────────────────────────────────────┘
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN || 'api-ondex.shoxpro.uz' }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.WEB_DOMAIN || 'web-ondex.shoxpro.uz' }}
            NEXT_PUBLIC_WS_URL=wss://${{ vars.API_DOMAIN || 'api-ondex.shoxpro.uz' }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.MEDIA_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - Web image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ══════════════════════════════════════════════════════════════════
  # 4. DAST — OWASP ZAP
  # ══════════════════════════════════════════════════════════════════
  #
  # ┌─ NEGA PRODUCTION REJIMIDA ────────────────────────────────────────┐
  # Server `APP_ENV=development` da zaif sozlamalarga ATAYLAB ruxsat
  # beradi: OTP kodlar javobda qaytariladi, CORS ochiq, Telegram
  # tasdiq kaliti talab qilinmaydi. DAST'ni shu rejimda ishlatish
  # NOTO'G'RI natija berardi — biz haqiqiy production sozlamasini
  # tekshirishimiz kerak.
  # └───────────────────────────────────────────────────────────────────┘
  dast_zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: build-and-push
    # PR'larda o'tkazib yuboriladi: `build-and-push` ham ishlamaydi,
    # ustiga ZAP eng qimmat bosqich (bazalar ko'tariladi, skaner
    # o'rgimchak yuradi) — har bir Dependabot PR'ida uni ishlatish
    # runner daqiqalarini bekorga sarflardi.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chust
          POSTGRES_PASSWORD: chust
          POSTGRES_DB: chustapp
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U chust"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: [ '27017:27017' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Compute image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # ┌─ BU PRODUCTION EMAS ──────────────────────────────────────────┐
      # Pastdagi konteyner FAQAT shu ZAP (DAST) ishi uchun ko'tariladi
      # va ish tugashi bilan yo'qoladi. Bazalar — yuqoridagi
      # `services:` bloki, ya'ni runner ichidagi vaqtinchalik nusxalar.
      #
      # `APP_ENV=production` bu yerda "haqiqiy server" degani EMAS —
      # u shunchaki skanerni ishlab chiqarish rejimidagi qattiqroq
      # sozlamalarga qarshi yurgizish uchun.
      #
      # HAQIQIY SERVER SOZLAMALARI bu faylda UMUMAN yo'q: ular VPS'dagi
      # `~/ondex/.env` faylida turadi (`TELEGRAM_BOT_TOKEN`,
      # `ALLOWED_ORIGINS`, `JWT_SECRET`, ...). "Deploy to VPS" ishi
      # o'sha faylda faqat `API_TAG`/`WEB_TAG` ni almashtiradi va
      # boshqa hech narsaga tegmaydi.
      #
      # Shu farq bir marta noto'g'ri xulosaga olib kelgan ("deploy
      # ALLOWED_ORIGINS ni app.ondex.uz ga o'zgartirib qo'yadi") —
      # pastdagi qiymatlarni server konfiguratsiyasi deb O'QIMANG.
      # └───────────────────────────────────────────────────────────────┘
      #
      # JWT_SECRET har ishlashda YANGI va tasodifiy. Workflow'ga qattiq
      # yozilgan sir — hatto test uchun bo'lsa ham — keyin nusxa
      # ko'chirilib production'ga tushib ketadi.
      #
      # ┌─ NEGA SOXTA R2 QIYMATLARI ──────────────────────────────────────┐
      # Server production rejimida R2 siz ISHGA TUSHMAYDI (fail-closed):
      # media faqat R2 da saqlanishi kerak, lokal disk deploy'da
      # yo'qoladi. Bu to'g'ri qoida va u yumshatilmaydi.
      #
      # Lekin ZAP skaneri uchun haqiqiy bucket kerak emas — u faqat
      # HTTP endpointlarni tekshiradi. Shuning uchun soxta qiymatlar
      # beriladi: klient quriladi, hech qanday fayl yuklanmaydi.
      # Domen ataylab `.invalid` — bu TLD hech qachon yechilmaydi,
      # ya'ni tasodifan haqiqiy xostga so'rov ketmaydi.
      #
      # Busiz konteyner "R2_BUCKET berilmagan" bilan darrov o'chib,
      # ZAP hech narsa topa olmasdi va deploy to'xtardi (2026-08-27).
      # └─────────────────────────────────────────────────────────────────┘
      - name: Start API (ZAP skaneri uchun vaqtinchalik konteyner)
        run: |
          docker run -d --name ondex-api --network host \
            -e APP_ENV=production \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ALLOWED_ORIGINS="https://app.ondex.uz" \
            -e TRUSTED_PROXIES="" \
            -e DATABASE_URL="postgres://chust:chust@localhost:5432/chustapp?sslmode=disable" \
            -e REDIS_ADDR="localhost:6379" \
            -e MONGODB_URI="mongodb://localhost:27017" \
            -e MONGODB_DB="chustapp" \
            -e R2_BUCKET="ci-smoke" \
            -e R2_ACCOUNT_ID="ci0000000000000000000000000000000" \
            -e R2_ACCESS_KEY_ID="ci" \
            -e R2_SECRET_ACCESS_KEY="ci" \
            -e R2_PUBLIC_URL="https://media.invalid" \
            "${{ steps.meta.outputs.image }}:${{ github.sha }}"

      - name: Wait for API
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/restaurants >/dev/null 2>&1; then
              echo "API tayyor ($i soniya)"; exit 0
            fi
            sleep 1
          done
          echo "::error::API 45 soniyada ko'tarilmadi"
          docker logs ondex-api
          exit 1

      # Baseline skaner: passiv qoidalar + o'rgimchak. Faol hujum
      # (`zap-full-scan`) emas — u soatlab davom etadi va har push'da
      # ishlatib bo'lmaydi. Uni tunги `schedule` uchun alohida
      # yoqish mumkin.
      #
      # `-I` — ogohlantirishlar quvurni to'xtatmaydi, faqat FAIL
      # darajasidagilar to'xtatadi. Nozik sozlash: .zap/rules.tsv
      # ┌─ NEGA ALOHIDA TAYYORLASH QADAMI ──────────────────────────────┐
      # Avval `.zap` papkasi to'g'ridan-to'g'ri mount qilinardi. Fayl
      # repoda bo'lmaganda Docker XATO BERMAYDI — u manba yo'lda BO'SH
      # PAPKA yaratib ulaydi. ZAP esa ichidan konfigni topolmay
      # tushunarsiz Python traceback bilan yiqilardi:
      #     FileNotFoundError: '/zap/cfg/rules.tsv'
      #
      # Endi fayl borligi OLDIN tekshiriladi va yo'q bo'lsa sabab
      # ANIQ yoziladi. Bitta mount yetarli: konfig ish papkasiga
      # nusxalanadi.
      # └───────────────────────────────────────────────────────────────┘
      - name: Prepare ZAP workspace
        run: |
          if [ ! -f .zap/rules.tsv ]; then
            echo "::error::.zap/rules.tsv topilmadi — fayl repoga commit qilinganini tekshiring"
            exit 1
          fi
          mkdir -p zap-report && chmod 777 zap-report
          cp .zap/rules.tsv zap-report/rules.tsv

      # Baseline skaner: passiv qoidalar + o'rgimchak. Faol hujum
      # (`zap-full-scan`) emas — u soatlab davom etadi va har push'da
      # ishlatib bo'lmaydi. Uni tungi `schedule` uchun alohida
      # yoqish mumkin.
      #
      # `-I` — ogohlantirishlar quvurni to'xtatmaydi, faqat FAIL
      # darajasidagilar to'xtatadi. Nozik sozlash: .zap/rules.tsv
      - name: Run OWASP ZAP Baseline Scan
        run: |
          set +e

          # ZAP KONTEYNERI ICHIDAN nishonni tekshiramiz. Runner'dan
          # `curl` ishlashi ZAP ham ko'ra oladi degani EMAS: ular
          # boshqa tarmoq kontekstida bo'lishi mumkin. Bu farqni
          # oldindan ajratmasak, ZAP tushunarsiz "summary file"
          # xatosi bilan yiqiladi va sabab ko'rinmaydi.
          docker run --rm --network host --entrypoint curl \
            ghcr.io/zaproxy/zaproxy:stable \
            -fsS --max-time 15 -o /dev/null -w 'ZAP konteyneridan nishon: HTTP %{http_code}\n' \
            http://localhost:8080/restaurants
          if [ $? -ne 0 ]; then
            echo "::error::ZAP konteyneri API'ga ULANOLMADI — skanerlashning ma'nosi yo'q"
            docker logs ondex-api 2>&1 | tail -30
            exit 1
          fi

          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8080/restaurants \
              -c /zap/wrk/rules.tsv \
              -r zap-report.html \
              -J zap-report.json \
              -I
          RC=$?
          echo "ZAP chiqish kodi: $RC"

          # ┌─ CHIQISH KODLARI AJRATILADI ──────────────────────────────┐
          # zap-baseline.py:
          #   0 — toza
          #   1 — FAIL darajasidagi topilma (HAQIQIY zaiflik)
          #   2 — faqat ogohlantirish (`-I` bilan bu holat bo'lmaydi)
          #   3 — ZAP'NING O'ZI ishlamadi (tarmoq, xotira, ichki xato)
          #
          # 3 ni 1 bilan bir xil ko'rish XATO edi: vositaning buzilishi
          # zaiflik topilgani bilan bir xil emas va butun quvurni
          # to'xtatib, deploy'ni bloklashi shart emas. Lekin u
          # KO'RINMAY ham qolmasligi kerak — shuning uchun aniq
          # ogohlantirish va loglar chiqariladi.
          # └───────────────────────────────────────────────────────────┘
          case "$RC" in
            0) echo "DAST toza — FAIL darajasidagi topilma yo'q" ;;
            1) echo "::error::ZAP zaiflik topdi (rules.tsv dagi FAIL qoidalari)"; exit 1 ;;
            3) echo "::warning::ZAP ISHGA TUSHMADI (kod 3) — bu xavfsizlik topilmasi EMAS, vosita xatosi. Hisobot artefaktini ko'ring." ;;
            *) echo "::error::ZAP kutilmagan kod qaytardi: $RC"; exit 1 ;;
          esac

      # ┌─ NEGA NISHON `/` EMAS, `/restaurants` ────────────────────────┐
      # Ildiz manzil 404 qaytaradi — API'da bunday marshrut yo'q.
      # O'rgimchak esa boshlang'ich sahifadan 200 kutadi va 404 olsa
      # UMUMAN yurmaydi:
      #     "Job spider error ... status code returned : 404 expected 200"
      #
      # Natijada skaner 66 ta "PASS" chiqarardi — lekin u faqat ikkita
      # 404 javobni ko'rgan bo'lardi. Yashil natija, nol qiymat.
      #
      # ┌─ CHEKLOV: BU HALI TO'LIQ API DAST EMAS ───────────────────────┐
      # JSON API'da havolalar yo'q, shuning uchun o'rgimchak bitta
      # endpointdan boshqasiga o'tolmaydi. `zap-baseline.py` amalda
      # faqat javob SARLAVHALARINI tekshiradi (bu ham foydali —
      # `rules.tsv` dagi uchta FAIL qoidasi aynan shuni qo'riqlaydi).
      #
      # Haqiqiy API skanerlash uchun OpenAPI/Swagger tavsifi va
      # `zap-api-scan.py` kerak. OnDex'da hozircha OpenAPI yo'q —
      # bu ochiq vazifa.
      # └───────────────────────────────────────────────────────────────┘

      - name: API logs (har doim)
        if: always()
        run: docker logs ondex-api || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: zap-report/
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════
  # 4b. Image'ni GHCR ga yuborish — FAQAT hamma tekshiruvdan keyin
  # ══════════════════════════════════════════════════════════════════
  push_image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: dast_zap
    # ┌─ `workflow_dispatch` HAM RUXSAT ETILADI ──────────────────────┐
    # Ilgari faqat `push` edi: kod o'zgarishisiz (masalan faqat CI
    # o'zgaruvchisi tuzatilganda) deploy'ni qo'lda qayta ishga
    # tushirish mumkin emas edi — quvur "muvaffaqiyatli" tugardi-yu,
    # VPS'dagi eski image o'zgarishsiz qolardi (2026-09-03 shu holatda
    # aniqlangan: domen o'zgaruvchisi to'g'irlangan, lekin build-web
    # yangi image'ni GHCR'ga yuborgani bilan VPS uni HECH QACHON
    # tortib olmadi, chunki bu shart uni bloklab turgan edi).
    # └───────────────────────────────────────────────────────────────┘
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/${IMAGE_NAME}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ══════════════════════════════════════════════════════════════════
  # 5. Deploy — VPS
  # ══════════════════════════════════════════════════════════════════
  #
  # `secrets` konteksti job darajasidagi `if:` da ISHLAMAYDI, shuning
  # uchun tekshiruv alohida job'da qadam darajasida bajariladi. Busiz
  # VPS sozlanmagunicha har push qizil xoch bilan tugardi.
  preflight:
    name: Deploy Preflight
    runs-on: ubuntu-latest
    # IKKALA image ham tayyor bo'lishini kutadi — aks holda deploy
    # `docker compose pull web` da yiqilardi.
    needs: [ push_image, build-web ]
    # `push_image` PR'da o'tkazib yuborilgani uchun bu ham avtomatik
    # o'tkaziladi. Shart ATAYLAB aniq yozilgan: bog'liqlik zanjiriga
    # tayanish o'rniga fayl o'zi qachon ishlashini ko'rsatib tursin.
    # `workflow_dispatch` HAM ruxsat etiladi — sabab yuqorida,
    # `push_image` job'idagi izohda.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SSH_HOST sozlanmagan — deploy o'tkazib yuborildi"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    # GitHub Environment: bu yerga "required reviewers" qo'yib,
    # production'ga chiqishni QO'LDA tasdiqlash talab qilinishi mumkin.
    environment: production
    steps:
      # ┌─ NEGA ALOHIDA DIAGNOSTIKA ────────────────────────────────────┐
      # `dial tcp ***:22: i/o timeout` xatosi HECH NARSA aytmaydi:
      # host noto'g'rimi, port boshqami, firewall bloklayaptimi —
      # uchalasi bir xil ko'rinadi. Sir esa `***` bilan yashiriladi.
      #
      # Bu qadam sirni OSHKOR QILMASDAN farqni ko'rsatadi: uzunlik
      # (probel/yangi qator bormi), DNS yechilishi va TCP holati.
      # └───────────────────────────────────────────────────────────────┘
      - name: SSH preflight diagnostics
        env:
          H: ${{ secrets.SSH_HOST }}
          P: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${P:-22}"
          echo "SSH_HOST uzunligi : ${#H} belgi"
          echo "SSH_PORT          : $PORT"

          # Tasodifiy probel yoki yangi qator — eng ko'p uchraydigan
          # va eng ko'rinmas xato.
          case "$H" in
            *" "*|*$'\t'*|*$'\n'*) echo "::warning::SSH_HOST ichida PROBEL yoki YANGI QATOR bor" ;;
          esac

          if getent hosts "$H" >/dev/null 2>&1; then
            echo "DNS               : yechildi"
          else
            echo "DNS               : yechilmadi (IP bo'lsa bu normal)"
          fi

          echo "Runner tashqi IP  : $(curl -fsS --max-time 10 https://api.ipify.org || echo 'aniqlanmadi')"

          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$H/$PORT" 2>/dev/null; then
            echo "TCP $PORT         : OCHIQ"
          else
            echo "::error::TCP $PORT yopiq — server javob bermayapti."
            echo "Sabablari: (1) SSH_HOST noto'g'ri  (2) SSH boshqa portda"
            echo "           (3) firewall GitHub IP'larini bloklagan"
            echo "           (4) provayder tarmoq firewall'i (IBM Cloud/SoftLayer)"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # ┌─ PAROLLI KALIT ────────────────────────────────────────────┐
          # Kalitda parol bo'lsa `SSH_PASSPHRASE` sirini qo'shing —
          # busiz action "this private key is passphrase protected"
          # bilan yiqiladi.
          #
          # LEKIN TAVSIYA ETILMAYDI: parol ham kalitning YONIDA, xuddi
          # shu GitHub secrets ichida saqlanadi. Ya'ni u hech qanday
          # qo'shimcha himoya bermaydi — sirlar omboriga kirgan odam
          # ikkalasini ham oladi.
          #
          # To'g'ri yo'l — CI UCHUN ALOHIDA, PAROLSIZ kalit
          # (`ssh-keygen -t ed25519 -N ""`). Shaxsiy kalitingiz esa
          # parolli qoladi va CI'ga umuman berilmaydi.
          # └────────────────────────────────────────────────────────────┘
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Ulanish 30 soniyada uzilib qolmasin (standart qiymat kichik).
          timeout: 30s
          command_timeout: 10m
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/ondex

            # .env dagi teglarni yangilaymiz (fayl bo'lmasa yaratiladi).
            # IKKALA image ham BIR XIL commit SHA bilan belgilanadi —
            # shunda API va web har doim bir xil kod versiyasidan
            # bo'ladi. Alohida teglar ishlatilsa, ular vaqt o'tib
            # ajralib ketardi va sababi topilmaydigan nomuvofiqlik
            # paydo bo'lardi.
            touch .env

            # ┌─ YANGI QATOR KAFOLATI ────────────────────────────────┐
            # `.env` oxirgi qatori yangi qator bilan tugamasa,
            # `echo ... >> .env` uni OLDINGI QATORGA YOPISHTIRADI:
            #     ARGON_MAX_CONCURRENCY=4API_TAG=abc123
            # Natijada ikkala o'zgaruvchi ham yo'qoladi va compose
            # "required variable API_TAG is missing" deb to'xtaydi.
            # └───────────────────────────────────────────────────────┘
            [ -s .env ] && [ "$(tail -c1 .env | wc -l)" -eq 0 ] && echo >> .env

            sed -i '/^API_TAG=/d;/^WEB_TAG=/d' .env
            echo "API_TAG=${IMAGE_TAG}" >> .env
            echo "WEB_TAG=${IMAGE_TAG}" >> .env

            # Yozilganini TASDIQLAYMIZ. Busiz nosozlik keyingi
            # qadamda ("required variable ... missing") chiqib,
            # sababi ko'rinmasdi.
            for v in API_TAG WEB_TAG; do
              grep -q "^${v}=${IMAGE_TAG}$" .env || {
                echo "::error::${v} .env ga yozilmadi"
                exit 1
              }
            done

            # ┌─ NEGA --password-stdin ───────────────────────────────┐
            # `docker login -p $TOKEN` da token serverning JARAYONLAR
            # RO'YXATIDA ko'rinadi (`ps aux`) va shell tarixiga
            # tushadi. Serverga kirgan har qanday foydalanuvchi uni
            # o'qib olardi.
            # └───────────────────────────────────────────────────────┘
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker compose pull api web
            docker compose up -d --no-deps --force-recreate api web

            docker logout ghcr.io
            docker image prune -f

      # Deploy'dan keyin server HAQIQATAN javob berayotganini
      # tekshiramiz. Busiz "yashil" quvur o'lik serverni yashirardi.
      - name: Smoke test
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::HEALTHCHECK_URL sozlanmagan — tekshiruv o'tkazib yuborildi"
            exit 0
          fi
          for i in $(seq 1 20); do
            if curl -fsS "$URL" >/dev/null; then echo "Server javob berdi"; exit 0; fi
            sleep 3
          done
          echo "::error::Deploy'dan keyin server javob bermayapti"
          exit 1
