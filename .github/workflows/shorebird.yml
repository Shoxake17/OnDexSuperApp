# OnDex mijoz ilovasi — Shorebird (OTA yangilanish).
#
# ┌─ NEGA ALOHIDA WORKFLOW ─────────────────────────────────────────────┐
# `deploy.yml` — backend/veb deploy quvuri, `tests.yml` — E2E testlar.
# Mobil ilova relizi ikkalasidan ham MUSTAQIL: u Play Store bilan
# bog'liq va o'z jadvali bilan chiqadi. Aralashtirilsa, backend
# deploy'i mobil build'ni kutib turardi.
# └─────────────────────────────────────────────────────────────────────┘
#
# ┌─ IKKI XIL AMAL — FARQINI BILIB TURING ──────────────────────────────┐
#   RELEASE — yangi versiya. Play Store'ga chiqadi, moderatsiya bor.
#             Native kod, plagin, ruxsat yoki asset o'zgarsa SHU kerak.
#
#   PATCH   — mavjud relizga yamoq. Do'kon kutilmaydi, foydalanuvchiga
#             daqiqalar ichida yetadi. FAQAT Dart kodi yamalanadi.
#
# Yamoq `pubspec.yaml` dagi bog'liqliklarni, `android/` ichidagi
# o'zgarishlarni yoki yangi assetni YETKAZA OLMAYDI. Shunday
# o'zgarish bo'lsa yamoq jimgina noto'g'ri ishlaydi — shuning uchun
# ikkalasi ham QO'LDA ishga tushiriladi va o'ylab tanlanadi.
# └─────────────────────────────────────────────────────────────────────┘
#
# ┌─ NEGA AVTOMATIK EMAS (push'da ishlamaydi) ──────────────────────────┐
# Yamoq kodni foydalanuvchi telefoniga TO'G'RIDAN-TO'G'RI yuboradi —
# do'kon tekshiruvisiz. `main` ga har merge avtomatik yamoq chiqarsa,
# ko'rib chiqilmagan commit bir necha daqiqada butun foydalanuvchi
# bazasiga tarqalardi.
#
# Shu sabab ikkala job ham `workflow_dispatch` — ya'ni odam qaror
# qiladi. Yamoq relizga TENG ehtiyot bilan chiqariladi.
# └─────────────────────────────────────────────────────────────────────┘

name: Mobile - Shorebird

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Nima qilinadi"
        required: true
        type: choice
        options:
          - patch
          - release
      release_version:
        description: "PATCH uchun: qaysi relizga (masalan 0.1.0+1). RELEASE uchun bo'sh qoldiring."
        required: false
        type: string

permissions:
  contents: read

# Ikki reliz bir vaqtda qurilmasin — ikkalasi ham AYNI Shorebird
# ilovasiga yozadi.
concurrency:
  group: shorebird-customer-app
  cancel-in-progress: false

jobs:
  shorebird:
    name: ${{ inputs.action == 'release' && 'Release (Play Store)' || 'Patch (OTA)' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/customer_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Sirlardan fayllarni tiklash ────────────────────────────────
      #
      # Ikkala fayl ham `.gitignore` da va repoda YO'Q:
      #   * imzolash kaliti — sir;
      #   * `google-services.json` — loyihaga xos konfiguratsiya,
      #     `com.google.gms.google-services` plagini busiz build'ni
      #     YIQITADI.
      - name: Imzolash kaliti va Firebase konfiguratsiyasi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 sozlanmagan."
            echo "Debug kaliti bilan imzolangan paketni Play Store qabul qilmaydi"
            echo "va unga Shorebird yamog'i ham qo'llanmaydi."
            exit 1
          fi

          echo "${KEYSTORE_B64}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

          if [ -n "${GOOGLE_SERVICES_B64}" ]; then
            echo "${GOOGLE_SERVICES_B64}" | base64 -d > android/app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 sozlanmagan — Firebase plagini build'ni yiqitadi."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      # ── Sifat darvozasi ────────────────────────────────────────────
      #
      # Yamoq do'kon tekshiruvidan O'TMAYDI, ya'ni bu yerdagi tekshiruv
      # foydalanuvchiga yetguncha bo'lgan YAGONA to'siq. Shuning uchun
      # u release uchun ham, patch uchun ham majburiy.
      - name: Analiz va testlar
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      # ── RELEASE ────────────────────────────────────────────────────
      #
      # `--flutter-version` KANAL nomini qabul qilmaydi — faqat aniq
      # raqam. Avval bu yerda `stable` turgan edi va Shorebird
      # `Version stable not found` bilan yiqilgan (exit 70).
      #
      # Qadash ataylab: reliz va unga chiqariladigan yamoqlar BIR XIL
      # Flutter versiyasida qurilishi kerak.
      # Mavjud versiyalar: `shorebird flutter versions list`.
      - name: Shorebird release
        if: inputs.action == 'release'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android \
            --flutter-version=3.44.9 \
            -- --dart-define-from-file=config/prod.json

      - name: Reliz artefaktini saqlash
        if: inputs.action == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ondex-customer-release
          # AAB — Play Store shuni talab qiladi.
          path: apps/customer_app/build/app/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      # ── PATCH ──────────────────────────────────────────────────────
      #
      # `--release-version` MAJBURIY: yamoq AYNAN bitta relizga
      # qo'llanadi. Ko'rsatilmasa Shorebird oxirgisini tanlaydi va bu
      # noto'g'ri relizga yamoq chiqarish xavfini yaratadi.
      - name: Reliz versiyasi ko'rsatilganini tekshirish
        if: inputs.action == 'patch'
        run: |
          # Teskari qo'shtirnoq ISHLATILMAYDI: bash uni buyruq
          # bajarish deb tushunadi va qadam boshqa sababdan yiqilardi.
          if [ -z "${{ inputs.release_version }}" ]; then
            echo "::error::PATCH uchun release_version MAJBURIY (masalan 0.1.0+1)."
            echo "Mavjud relizlarni ko'rish: shorebird releases list"
            exit 1
          fi

      - name: Shorebird patch
        if: inputs.action == 'patch'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch android \
            --release-version=${{ inputs.release_version }} \
            --no-confirm \
            -- --dart-define-from-file=config/prod.json

      - name: Xulosa
        if: always()
        run: |
          {
            echo "### Shorebird — ${{ inputs.action }}"
            if [ "${{ inputs.action }}" = "release" ]; then
              echo "AAB artefakt sifatida saqlandi. Play Console'ga QO'LDA yuklanadi."
              echo "Yuklangach yamoq chiqarish uchun shu versiyani ishlating."
            else
              echo "Yamoq \`${{ inputs.release_version }}\` relizga chiqarildi."
              echo "Foydalanuvchilar ilovani KEYINGI ochganda oladi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
