<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnDex — joy tanlash</title>
<!--
  ┌─ BU SAHIFA NIMA UCHUN BACKENDDAN BERILADI ────────────────────────┐
  Windows desktop ilovasida `google_maps_flutter` ISHLAMAYDI — paket
  faqat android/ios/web platformalarini e'lon qiladi va desktopda
  "TargetPlatform.windows is not yet supported by the maps plugin"
  xatosini beradi. Shuning uchun desktopda xarita WebView2 ichida,
  Google Maps JS orqali chiziladi.

  Sahifa `file://` yoki `data:` sifatida emas, aynan API domenidan
  yuklanadi. NEGA: Maps kaliti Google Console'da HTTP REFERRER bo'yicha
  cheklangan. `file://` va `data:` da referrer bo'lmaydi va Google
  `RefererNotAllowedMapError` bilan rad etadi. API domeni esa
  ro'yxatga bir marta qo'shiladi va kalit cheklangan holicha qoladi.

  ┌─ KALIT SAHIFAGA YOZILMAYDI ───────────────────────────────────────┐
  Bu HTML ichida kalit YO'Q va sahifaning o'zi ochiq (auth talab
  qilmaydi) — chunki unda hech qanday sir yo'q. Kalitni sahifa
  keyinroq `/config/maps` dan OLADI, host bergan JWT bilan. Token
  URL'ga qo'yilmaydi (u tarix/loglarga tushardi), `postWebMessage`
  orqali keladi.
  └───────────────────────────────────────────────────────────────────┘
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #eee; }
  #map { width: 100%; height: 100%; }
  #msg {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font: 15px/1.5 system-ui, sans-serif; color: #555;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  #msg.err { color: #b3261e; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">Xarita yuklanmoqda…</div>

<!--
  `nonce` — server har so'rovda tasodifiy qiymat qo'yadi va aynan shu
  qiymatni CSP sarlavhasida e'lon qiladi (`routes_mappicker.go`).

  NEGA: global CSP `default-src 'none'` bo'lib, u `script-src` ni ham
  qamrab olardi va BU SKRIPT brauzer tomonidan butunlay bloklanardi.
  Natijada sahifa "Xarita yuklanmoqda…" da abadiy qotib qolardi —
  qo'yilgan barcha diagnostikalar ham shu bloklangan skript ichida
  bo'lgani uchun HECH QACHON ko'rinmasdi (2026-08-13 da aniqlandi).

  `'unsafe-inline'` ATAYLAB ishlatilmadi: u sahifaga tushgan istalgan
  inline skriptga ruxsat berardi. Nonce esa faqat SERVER YOZGAN
  skriptga ruxsat beradi.
-->
<script nonce="__CSP_NONCE__">
(function () {
  var msg = document.getElementById('msg');
  var marker = null;
  var map = null;

  function show(text, isErr) {
    msg.textContent = text;
    msg.className = isErr ? 'err' : '';
    msg.style.display = 'flex';
  }
  function hide() { msg.style.display = 'none'; }

  // Hostga (Flutter) xabar. `webview_windows` shu kanalni tinglaydi.
  function toHost(obj) {
    try { window.chrome.webview.postMessage(JSON.stringify(obj)); } catch (e) {}
  }

  // ┌─ GOOGLE'NING KONSOL XABARINI USHLAB QOLAMIZ ──────────────────┐
  // `gm_authFailure` faqat "kalit rad etildi" deydi, SABABINI aytmaydi.
  // Aniq sabab (`RefererNotAllowedMapError`, `ApiNotActivatedMapError`,
  // `BillingNotEnabledMapError`) va ruxsat berilishi kerak bo'lgan
  // ANIQ manzil faqat `console.error` ga yoziladi.
  //
  // WebView2 ichida konsolni ko'rish deyarli imkonsiz, ya'ni eng
  // qimmatli ma'lumot ko'rinmay ketardi. Shuning uchun uni ushlab
  // olamiz va ekranga chiqaramiz.
  // └───────────────────────────────────────────────────────────────┘
  var gmapsLog = [];
  (function () {
    var orig = window.console && window.console.error;
    if (!orig) return;
    window.console.error = function () {
      try {
        var text = Array.prototype.join.call(arguments, ' ');
        if (/Google Maps|MapError|ApiNotActivated|Billing/i.test(text)) {
          gmapsLog.push(text);
        }
      } catch (e) {}
      return orig.apply(window.console, arguments);
    };
  })();

  function initMap(center) {
    map = new google.maps.Map(document.getElementById('map'), {
      center: center,
      zoom: 15,
      tilt: 45,
      mapTypeControl: true,
      streetViewControl: false,
      fullscreenControl: false,
    });
    hide();
    map.addListener('click', function (e) {
      var lat = e.latLng.lat(), lng = e.latLng.lng();
      if (marker) marker.setMap(null);
      marker = new google.maps.Marker({ position: e.latLng, map: map });
      // Teskari geokodlashni HOST qiladi (`/geocode/reverse`), chunki
      // Google Geocoding API brauzerdan chaqirilganda CORS bilan
      // bloklanadi va kalit ham frontendga chiqib ketardi.
      toHost({ type: 'pick', lat: lat, lng: lng });
    });
    toHost({ type: 'ready' });
  }

  function loadMaps(key, center) {
    show('Xarita chizilmoqda…');

    // ┌─ ENG MUHIM DIAGNOSTIKA ─────────────────────────────────────┐
    // Kalit rad etilganda (referrer mos emas, API yoqilmagan,
    // billing yo'q) Google skriptni MUVAFFAQIYATLI beradi, lekin
    // `callback` ni CHAQIRMAYDI va `onerror` ham ishlamaydi —
    // tarmoq xatosi yo'q. Natijada sahifa jimgina kutish holatida
    // qolardi va sabab faqat brauzer konsolida ko'rinardi (WebView
    // ichida esa uni ko'rish deyarli imkonsiz).
    //
    // `gm_authFailure` — Google'ning aynan shu holat uchun beradigan
    // rasmiy ilgagi. Endi sabab ekranda yoziladi.
    // └─────────────────────────────────────────────────────────────┘
    window.gm_authFailure = function () {
      // Google xabarni `gm_authFailure` dan biroz KEYIN yozishi
      // mumkin — shu sabab kichik kechikish bilan o'qiymiz.
      setTimeout(function () {
        // Manzil QATTIQ YOZILMAYDI. Avval bu yerda production domeni
        // turardi va sahifa tunnel/localhost'dan ochilganda odamni
        // NOTO'G'RI domenni ro'yxatga qo'shishga yo'naltirardi.
        var origin = location.origin;
        var why = gmapsLog.length
            ? '\n\nGoogle aytdi:\n' + gmapsLog.join('\n')
            : '';
        show('Google xarita kalitini RAD ETDI.\n\n' +
             'Cloud Console → Credentials → shu kalit:\n' +
             '1. "Website restrictions" ro\'yxatiga QO\'SHING:\n' +
             '     ' + origin + '/*\n' +
             '2. "Maps JavaScript API" yoqilgan bo\'lsin\n' +
             '3. loyihada billing yoqilgan bo\'lsin' + why, true);
        toHost({
          type: 'error',
          message: 'gm_authFailure',
          origin: origin,
          detail: gmapsLog.join(' | '),
        });
      }, 1200);
    };

    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
            encodeURIComponent(key) + '&language=uz&callback=__ondexInit';
    s.async = true;
    s.onerror = function () {
      show('Google Maps skriptini yuklab bo\'lmadi (internet yoki kalit).', true);
      toHost({ type: 'error', message: 'maps script yuklanmadi' });
    };
    window.__ondexInit = function () { initMap(center); };
    document.head.appendChild(s);

    // Skript yuklandi, lekin `callback` ham, `gm_authFailure` ham
    // ishlamasa — bu ham jimgina to'xtash bo'lardi.
    setTimeout(function () {
      if (!map) {
        show('Google Maps javob bermadi (10s).\n' +
             'Ehtimol kalit yoki tarmoq cheklovi.', true);
        toHost({ type: 'error', message: 'maps init timeout' });
      }
    }, 10000);
  }

  // Sozlama: { token, lat, lng, apiBase }
  //
  // ┌─ NEGA XABAR ORQALI EMAS ──────────────────────────────────────┐
  // Avval host sozlamani `postWebMessage` bilan yuborardi, sahifa esa
  // uni kutib turardi. Bu ikki tomonlama "qo'l berish" edi va uning
  // istalgan bo'g'ini uzilsa sahifa JIMGINA "Xarita yuklanmoqda..."
  // holatida qotib qolardi — aynan shu nosozlik kuzatilgan.
  //
  // Endi host `addScriptToExecuteOnDocumentCreated` orqali
  // `window.__ondexConfig` ni sahifa skriptlaridan OLDIN joylashtiradi.
  // Ya'ni sozlama shu skript ishga tushganda ALLAQACHON mavjud:
  // kutish ham, tartib muammosi ham yo'q.
  //
  // Token baribir URL'ga tushmaydi (u tarix va server loglariga
  // yozilardi) — u faqat sahifa xotirasida qoladi.
  // └───────────────────────────────────────────────────────────────┘
  function start(cfg) {
    var center = { lat: cfg.lat, lng: cfg.lng };
    show('Xarita kaliti olinmoqda…');

    // MUDDAT: `fetch` ning O'ZI hech qachon uzilmaydi. Server javob
    // bermay qolsa sahifa abadiy kutish holatida qolardi va bu ham
    // "Xarita yuklanmoqda..." ko'rinishida namoyon bo'lardi.
    var ctl = null, killer = null;
    try {
      ctl = new AbortController();
      killer = setTimeout(function () { ctl.abort(); }, 10000);
    } catch (e) {}

    fetch(cfg.apiBase + '/config/maps', {
      headers: { 'Authorization': 'Bearer ' + cfg.token },
      signal: ctl ? ctl.signal : undefined,
    }).then(function (r) {
      if (killer) clearTimeout(killer);
      if (!r.ok) throw new Error('config/maps -> ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d.maps_api_key) throw new Error('kalit bo\'sh');
      loadMaps(d.maps_api_key, center);
    }).catch(function (e) {
      if (killer) clearTimeout(killer);
      var why = (e && e.name === 'AbortError')
          ? 'server 10 soniyada javob bermadi'
          : e.message;
      show('Xarita kalitini olib bo\'lmadi: ' + why + '\n\n' +
           'Sessiya eskirgan bo\'lsa ilovadan chiqib qaytadan kiring.', true);
      toHost({ type: 'error', message: String(e) });
    });
  }

  var started = false;
  function startOnce(cfg) {
    if (started || !cfg || !cfg.token) return;
    started = true;
    start(cfg);
  }

  // ASOSIY YO'L: sozlama sahifa yuklanishidan oldin joylashtirilgan.
  startOnce(window.__ondexConfig);

  // ZAXIRA YO'L: eski host (yoki injektsiya ishlamagan holat) uchun
  // xabar ham qabul qilinadi. `startOnce` ikki marta ishga tushishning
  // oldini oladi.
  try {
    window.chrome.webview.addEventListener('message', function (e) {
      var cfg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      startOnce(cfg);
    });
    toHost({ type: 'boot' });
  } catch (e) {
    // `chrome.webview` yo'q — sahifa oddiy brauzerda ochilgan.
  }

  // ┌─ JIMGINA QOTIB QOLMASLIK KAFOLATI ────────────────────────────┐
  // Avval sozlama kelmasa ekranda abadiy "Xarita yuklanmoqda..."
  // turardi va sabab umuman ko'rinmasdi. Endi 5 soniyadan keyin
  // ANIQ sabab yoziladi.
  // └───────────────────────────────────────────────────────────────┘
  setTimeout(function () {
    if (!started) {
      show('Sozlama kelmadi: ilova xarita kalitini uzata olmadi.\n' +
           'Ilovadan chiqib qaytadan kiring.', true);
      toHost({ type: 'error', message: 'config yetib kelmadi' });
    }
  }, 5000);
})();
</script>
</body>
</html>
