# qo'yilgan tekshiruv"ga aylanadi.

[[IgnoredVulns]]
id = "GO-2026-5932"
# `golang.org/x/crypto/openpgp` — qo'llab-quvvatlanmaydigan va xavfli paket.
# Tuzatilgan versiyasi YO'Q, shuning uchun OSV modul darajasida HAR QANDAY
# `x/crypto` versiyasini belgilaydi.
#
# Tekshirildi (2026-09-15): `go list -deps -test ./...` — `openpgp` loyiha
# kodida ham, bog'liqliklar grafida ham import qilinmaydi (ishlatiladi:
# argon2, chacha20poly1305, hkdf, scrypt, pbkdf2, ocsp).
#
# Himoya shu istisnodan keyin ham saqlanadi:
#   * `govulncheck` (deploy.yml) chaqiriladigan kod bo'yicha tekshiradi —
#     `openpgp` ishlatilsa u o'zi yiqiladi;
#   * `.golangci.yml` dagi `depguard` bu paketni import qilishni taqiqlaydi.
reason = "x/crypto/openpgp import qilinmaydi (go list -deps bilan tekshirilgan); govulncheck va depguard qo'riqlaydi"

[[IgnoredVulns]]
id = "GHSA-jrc7-96c5-q579"
# maplibre-gl <= 6.4.0 — XSS: MapLibre'ning O'Z `AttributionControl`i
# (`DOM.sanitize()`) ishonchsiz atribut satrini HTML sifatida kiritganda.
#
# Bizda bu qatlamga ISHONCHSIZ matn tushmaydi: xarita (`apps/web/lib/maps/
# ondex-view.ts`, `internal/httpapi/assets/map_picker.html`) faqat BIZNING
# OnDexMap uslubini (`maps.ondex.uz/tiles/style.json`) o'qiydi, atribut
# satrlari o'sha uslub va PMTiles sarlavhasidan keladi — ikkalasi ham o'zimizning
# serverda, foydalanuvchi kiritmaydi. Boshqa manbadan uslub berish yo'li yo'q:
# manzil serverdagi `ONDEXMAP_API_URL` dan olinadi va ilovada faqat `https://`
# qabul qilinadi.
#
# Versiya 4.7.1 da QULFLANGAN (v5+ WebGL2 talab qiladi: eski qurilmalarda xarita
# jimgina oq qoladi — `ondexmap-maplibre-v6-webgl2-regression`). Yangilash
# WebGL2 qamrovi aniqlangach alohida qaror.
reason = "atribut satri faqat o'zimizning uslubdan (maps.ondex.uz) keladi, begona matn MapLibre AttributionControl'iga tushmaydi; v5+ WebGL2 talab qiladi"