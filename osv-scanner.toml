# OSV-Scanner — tekshirilgan va asoslangan istisnolar.
#
# Qoida (`.gitleaks.toml` bilan bir xil): har bir istisnoda NEGA bu bizga
# tegishli emasligi yoziladi. Izohsiz istisno vaqt o'tib "o'chirib
# qo'yilgan tekshiruv"ga aylanadi.

# 2026-11-12 (SEC-ZERO, Plane 447): GO-2026-5932 istisnosi OLIB TASHLANDI —
# x/crypto v0.59.0 da tuzatilgan, `osv-scanner scan source -L go.mod`
# istisnosiz "No issues found". Hozir Go uchun istisno YO'Q va shunday qolsin:
# yangi zaiflik = yangilash yoki kodni tuzatish, "ignore" emas.

# Eslatma: apps/web/package-lock.json uchun alohida `apps/web/osv-scanner.toml`
# bor. OSV v2 config fayllarni kaskadlamaydi — har bir lockfile bilan bir xil
# katalogda bo'lishi kerak (yoki --config flag ixtiyoriy global).