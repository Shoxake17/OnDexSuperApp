name: chust_customer
description: ChustApp — mijoz ilovasi
publish_to: "none"
version: 0.2.1+13

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # Umumiy yadro — API klienti, sessiya, format, holat yorliqlari.
  # 4 ta ilovada takrorlangan kod shu yerda BIR marta yozilgan.
  ondex_core:
    path: ../../packages/ondex_core
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # Ovozli rejim (Gemini Live): mikrofondan XOM PCM16 oqimi va
  # modeldan kelgan PCM16 ni past kechikish bilan chalish.
  # speech_to_text va flutter_tts OLIB TASHLANDI: ular o'zbek tilini
  # qo'llamaydi - telefonda tanish ru-RU ga tushardi, javob esa o'zbek
  # matnini rus ovozi bilan o'qirdi (lib/data/ai_live.dart izohiga qarang).
  record: ^7.1.1
  flutter_pcm_sound: ^3.3.3
  shared_preferences: ^2.2.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  web: ^1.1.0
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.0.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  app_links: ^7.2.1
  local_auth: ^3.0.2
  local_auth_android: ^2.0.9
  crypto: ^3.0.7
  firebase_messaging: ^16.5.0
  # Stol QR kodini ILOVA ICHIDA skanerlash uchun (`qr_scan_screen.dart`).
  #
  # NEGA KERAK: Telegram Mini App'da kamerani Telegram beradi
  # (`showScanQrPopup`), mijoz ilovasida esa bunday imkon YO'Q — u
  # yerda QR tugmasi faqat "telefon kamerasi bilan skanerlang" degan
  # tushuntirishni ko'rsatardi, ya'ni stol oqimi ilovada amalda
  # ishlamasdi.
  mobile_scanner: ^7.4.0
  # Taomni kamera tasviri ustida ko'rsatish (`ar/ar_camera_screen.dart`).
  #
  # `mobile_scanner` ham kamera oynasini bera olardi, lekin u HAR
  # KADRDA QR qidiradi — bu yerda esa skanerlash umuman kerak emas va
  # u faqat batareyani yeydi. Kamera oynasi uchun to'g'ri vosita —
  # rasmiy `camera` plagini.
  camera: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Ilova belgisini (launcher icon) `assets/logo.png` dan barcha
  # Android/iOS o'lchamlariga generatsiya qiladi. Qo'lda 10+ PNG
  # yasash o'rniga bitta buyruq — va o'lchamlardan biri unutilib
  # qolmaydi.
  flutter_launcher_icons: ^0.14.4

# Ilova belgisi: `flutter pub run flutter_launcher_icons` bilan
# qayta generatsiya qilinadi (logo o'zgarsa).
flutter_launcher_icons:
  android: true
  # `ios: false` — bu loyihada `ios/` papkasi umuman yo'q (mijoz
  # ilovasi hozircha Android + web). `true` qilinsa generator mavjud
  # bo'lmagan `Assets.xcassets` yo'liga yozmoqchi bo'lib yiqiladi.
  # iOS kerak bo'lganda avval `flutter create --platforms=ios .`
  # bajariladi, keyin bu yerda `true` qilinadi.
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/categories/
    # Bo'sh ekranlar uchun OnDex maskoti (sevimlilar, savat,
    # bildirishnomalar) — `widgets/empty_state.dart`.
    - assets/empty/
    # To'lov tizimlari logotiplari — rasmiylashtirish ekranidagi
    # "To'lov usuli" bo'limi uchun (image/ papkasidan nusxa; u repoga
    # kirmaydi, shuning uchun fayllar SHU YERDA saqlanadi).
    - assets/payments/
    - assets/eltago.png
    - assets/ondex_hero.png
    # Super app bosh sahifasidagi xizmat rasmlari (`image/main.png`
    # maketidan kesib olingan). Maket 907px kenglikda, ya'ni bu
    # rasmlar 1x atrofida - yuqori zichlikdagi ekranda biroz yumshoq
    # ko'rinadi. Haqiqiy fotolar tayyor bo'lganda ularni SHU NOMLAR
    # bilan almashtirish yetadi, kodga tegish shart emas.
    - assets/services/
    # Shaddiy AI yordamchisining yuzi — 4 ta kadr (jim, og'iz katta,
    # og'iz kichik, ko'z yumiq). Ovozli rejimda ular ustma-ust turib
    # almashadi va yuz "gapirayotgandek" ko'rinadi.
    #
    # ASLI Shaddiy frontendidan (`Shaddiy_App/public/`), lekin u yerda
    # ular 4.7 MB PNG edi. Bu yerda 512x600 JPEG — 238 KB, ya'ni 20
    # barobar kichik. Doira ichida kesilgani uchun shaffoflik kerak
    # emas va JPEG artefaktlari ko'rinmaydi.
    - assets/shaddiy/
    - assets/google_logo.png
    - assets/uz_flag.png
    - shorebird.yaml
