# Xotira chegaralari MASHINAGA moslangan (15.7 GB RAM, undan ~3 GB bo'sh).
#
# Avval `-Xmx8G -XX:MaxMetaspaceSize=4G` edi — ya'ni Gradle 12 GB so'rardi.
# Bo'sh RAM yetmaganda daemon jimgina o'lardi va build "Gradle build daemon
# disappeared unexpectedly" degan chalg'ituvchi xato bilan yiqilardi (kod
# muammosi deb vaqt sarflashga sabab bo'ladi). 3 GB heap bu loyiha uchun
# yetarli va boshqa jarayonlarni siqib chiqarmaydi.
#
# METASPACE 512m -> 1g (2026-08-18). Sabab: RELIZ build'idagi
# `lintVitalAnalyzeRelease` juda ko'p sinf yuklaydi va 512m ga
# sig'masdi — `java.lang.OutOfMemoryError: Metaspace` bilan yiqilardi.
# Debug build'da bu vazifa umuman ishlamaydi, shuning uchun muammo
# faqat `shorebird release/patch` va `flutter build --release` da
# ko'rinardi.
#
# Lintni O'CHIRISH oson yo'l bo'lardi (`lint { checkReleaseBuilds =
# false }`), lekin ATAYLAB qilinmadi: u aynan shu loyihada bir marta
# muammo bo'lgan narsalarni tutadi — INTERNET ruxsati, MainActivity
# paketi, XML izohidagi qo'sh defis. Bular debug'da sezilmaydi va
# faqat relizda chiqadi.
#
# Metaspace heap'dan TASHQARIDA ajratiladi, ya'ni bu qo'shimcha 512 MB
# `-Xmx1536m` ga qo'shiladi. Bo'sh RAM kam bo'lsa avval Chrome yoki
# WSL'ni yoping (qarang: `.wslconfig`).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin kompilyatori ALOHIDA JVM'da ishlaydi — uni cheklamasa, Gradle
# chegarasidan mustaqil ravishda yana bir necha gigabayt so'raydi va
# ikkalasi birgalikda RAM'ni tugatadi.
kotlin.daemon.jvmargs=-Xmx1024m
# Parallel worker'lar soni — har biri xotira oladi.
org.gradle.workers.max=2
android.useAndroidX=true
# Loyiha (F:) va pub-cache/Kotlin daemon keshi (C:) turli disklarda bo'lgani
# uchun Kotlin incremental compiler ular orasida nisbiy yo'l hisoblashga
# urinib qulaydi ("this and base files have different roots"). Bu — Windows
# uchun ma'lum Kotlin bug (KT-*), incremental compilationni o'chirish bilan
# oldini olinadi (build biroz sekinroq, lekin barqaror).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
