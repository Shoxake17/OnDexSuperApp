# Xotira chegaralari MASHINAGA moslangan (15.7 GB RAM, undan ~3 GB bo'sh).
#
# Avval `-Xmx8G -XX:MaxMetaspaceSize=4G` edi — ya'ni Gradle 12 GB so'rardi.
# Bo'sh RAM yetmaganda daemon jimgina o'lardi va build "Gradle build daemon
# disappeared unexpectedly" degan chalg'ituvchi xato bilan yiqilardi (kod
# muammosi deb vaqt sarflashga sabab bo'ladi). 3 GB heap bu loyiha uchun
# yetarli va boshqa jarayonlarni siqib chiqarmaydi.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin kompilyatori ALOHIDA JVM'da ishlaydi — uni cheklamasa, Gradle
# chegarasidan mustaqil ravishda yana bir necha gigabayt so'raydi va
# ikkalasi birgalikda RAM'ni tugatadi.
kotlin.daemon.jvmargs=-Xmx1024m
# Parallel worker'lar soni — har biri xotira oladi.
org.gradle.workers.max=2
android.useAndroidX=true
# Loyiha (F:) va pub-cache/Kotlin daemon keshi (C:) turli disklarda bo'lgani
# uchun Kotlin incremental compiler ular orasida nisbiy yo'l hisoblashga
# urinib qulaydi ("this and base files have different roots"). Bu — Windows
# uchun ma'lum Kotlin bug (KT-*), incremental compilationni o'chirish bilan
# oldini olinadi (build biroz sekinroq, lekin barqaror).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
