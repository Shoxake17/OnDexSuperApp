name: chust_restaurant
description: ChustApp — Restoran paneli
publish_to: "none"
version: 0.1.6+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ondex_core:
    path: ../../packages/ondex_core
  # Yordam markazi va Chat markazi — admin paneli bilan AYNI chat mantiqi.
  ondex_support:
    path: ../../packages/ondex_support
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # Telegram bot havolasini ochish uchun (kirish oqimi). Kod SMS emas,
  # bot orqali keladi — `api.telegramStart` izohiga qarang.
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.0
  file_picker: ^8.1.3
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.14.2

dev_dependencies:
  flutter_lints: ^4.0.0
  # Widget testlari uchun. Birinchi test — kartochka sarlavhasining
  # "overflow" bermasligi (`test/order_card_header_test.dart`).
  flutter_test:
    sdk: flutter
  # Ilova belgisi: `dart run flutter_launcher_icons`
  # `assets/app_icon.png` dan web favicon/PWA va Windows `.ico`.
  # Android/iOS papkalari bu loyihada yo'q.
  flutter_launcher_icons: ^0.14.4

# Brauzer tab, PWA va Windows exe — Flutter default emas, OnDex.
# Manba: `image/ondex.png` (gitda `assets/ondex.png`). Asl 692x749;
# `app_icon.png` — qora fonda cho'zilmagan 1024x1024 kvadrat.
flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#000000"
    theme_color: "#F2650F"
  # ┌─ WINDOWS BELGISI BU YERDA GENERATSIYA QILINMAYDI ────────────────┐
  # OnDex Merchant logosi KENG va ichida "MERCHANT" yozuvi bor: generator
  # yasagan bitta chizmali `.ico` 256px da chiroyli, 32px da (Explorer,
  # vazifalar paneli) o'qib bo'lmaydigan dog'ga aylanardi.
  #
  # Shuning uchun `.ico` qo'lda, KO'P CHIZMALI qilib yasaladi:
  #     .\scripts\windows_icon.ps1
  # 16-48px — sof OnDex belgisi (`image/ondex.png`), 64-256px — to'liq
  # Merchant logosi (quyidagi `app_icon_windows.png`). `generate: true`
  # qaytarilsa, generator o'sha faylni bosib ketadi.
  # └──────────────────────────────────────────────────────────────────┘
  windows:
    generate: false
    image_path: "assets/app_icon_windows.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - sound/ding.mp3
    # Brend logotipi — yon menyudagi sarlavhada. Ilgari u kod bilan
    # CHIZILARDI (rangli kvadrat + ikonka + "Ondex" matni), ya'ni
    # haqiqiy logotipga o'xshamasdi.
    - assets/ondex.png
    # OnDex Merchant logotipi — kirish ekranida (`screens/login_screen.dart`).
    # `app_icon_windows.png` dan bo'sh chetlari kesilgan, nisbati saqlangan:
    # yon menyudagi 38x38 kvadrat joyga bu KENG logo sig'maydi, u yerda
    # OnDex belgisi (`ondex.png`) qoladi.
    - assets/merchant_logo.png
    # To'lov tizimlari brend logotiplari (mijoz ilovasidagi bilan bir xil
    # fayllar) — "Restoran sozlamalari" → "To'lov usullari".
    - assets/payments/click.png
    - assets/payments/payme.png
