name: chust_courier
description: OnDexGO — kuryer ilovasi
publish_to: "none"
version: 0.1.3+3

environment:
  sdk: ^3.12.2

dependencies:
  ondex_core:
    path: ../../packages/ondex_core
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # Sessiya tokeni uchun — Android Keystore bilan shifrlangan ombor.
  # `shared_preferences` (shifrlanmagan XML) faqat eski tokenni bir
  # martalik ko'chirish uchun qoldirilgan (lib/token_store.dart).
  flutter_secure_storage: ^10.3.1
  web_socket_channel: ^3.0.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  web: ^1.1.0
  # Google Maps veb'da xom HTML platform-view (HtmlElementView) sifatida
  # chiziladi — Flutter'ning gesture arenasidan TASHQARIDA. Shuning uchun
  # xarita ustiga qo'yilgan har qanday Flutter vidjeti (suzuvchi panel,
  # dumaloq tugmalar) uchun `PointerInterceptor` bilan o'ralmasa, sichqoncha/
  # barmoq harakati pastdagi xaritaga "sizib o'tib", uni ham surib/aylantirib
  # yuboradi — aynan shu www.pointer_interceptor'ning rasmiy vazifasi.
  pointer_interceptor: ^0.10.1+2
  # Eski (5.x) versiyalar audioplayers_android'ni compileSdk 33ga QATTIQ
  # yozib qo'yadi (loyiha sozlamasidan mustaqil) — zamonaviy AndroidX bilan
  # mos kelmaydi. Eng so'nggi versiya to'g'ri sozlangan (compileSdk 36
  # bilan mos), shuning uchun caret bilan.
  audioplayers: ^6.0.0
  # Restoranga "Qo'ng'iroq qilish" tugmasi uchun (tel: havolasini ochadi).
  url_launcher: ^6.3.0
  posthog_flutter: ^5.39.0
  # Yangi buyurtma taklifi ilova YOPIQ bo'lsa ham yetib borsin (FCM push).
  # Versiyalar affitsiant ilovasi bilan bir xil.
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Ilova belgisini `assets/logo.png` dan barcha o'lchamlarga
  # generatsiya qiladi (mijoz ilovasidagi bilan bir xil naqsh).
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  jni:
    path: ../../local_packages/jni
  jni_flutter:
    path: ../../local_packages/jni_flutter

flutter_launcher_icons:
  android: true
  # `ios: false` — bu loyihada `ios/` papkasi umuman yo'q (kuryer
  # ilovasi Android uchun qurilgan). `true` qilinsa generator mavjud
  # bo'lmagan `Assets.xcassets` yo'liga yozmoqchi bo'lib yiqiladi.
  # iOS kerak bo'lganda avval `flutter create --platforms=ios .`
  # bajariladi, keyin bu yerda `true` qilinadi.
  ios: false
  # Manba: `image/OnDexGO.png` (markazdagi qora maydon kesilgan), bo'sh
  # chetlarsiz kvadratga joylangan. Legacy belgi — shaffof; Android 8+
  # adaptive belgi — QORA fon (#121212, OnDexPro bilan bir xil) ustida
  # xavfsiz zonaga (62%) sig'dirilgan old qatlam, aks holda launcher
  # logoni doiraga qirqib yuborardi.
  image_path: "assets/logo.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/launcher_foreground.png"
  # Old qatlam rasmining O'ZIDA xavfsiz zona hisobga olingan — generatorning
  # standart 16% ichki chekinishi logoni keragidan kichraytirardi.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    # OnDexGO logotipi (image/OnDexGO.png dan).
    - assets/logo.png
    - assets/navi.png
    - assets/box.png
    - assets/ondex.png
    - assets/sound/kuryersound.mp3
    # Ovozli yo'l ko'rsatish iboralari ("Kore" ovozi) — `go run ./cmd/voicegen`.
    - assets/voice/
