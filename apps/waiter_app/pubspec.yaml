name: ondex_waiter
description: OnDex — Affitsiant ilovasi (stol buyurtmalari)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  # Umumiy yadro: ApiClient, WsClient, TokenStore, formatlash.
  # Har bir tuzatish BIR marta qilinadi va hamma ilovaga yetadi.
  ondex_core:
    path: ../../packages/ondex_core
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # Sessiya tokeni uchun — Android Keystore / iOS Keychain bilan
  # shifrlangan ombor (ondex_core/TokenStore shuni ishlatadi).
  flutter_secure_storage: ^10.3.1
  web_socket_channel: ^3.0.0
  # Push: taom tayyor bo'lganda affitsiant zalda yuradi va ekran
  # o'chiq bo'ladi — jonli WS yetarli emas.
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2
  # "Tayyor" signali — telefon cho'ntakda bo'lsa ovoz muhim.
  audioplayers: ^6.0.0
  # Telegram bot havolasini ochish uchun (kirish oqimi). Kod SMS emas,
  # bot orqali keladi — `api.telegramStart` izohiga qarang.
  url_launcher: ^6.3.2
  posthog_flutter: ^5.39.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Ilova belgisini `assets/logo.png` dan barcha o'lchamlarga
  # generatsiya qiladi (boshqa OnDex ilovalari bilan bir xil naqsh).
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  jni:
    path: ../../local_packages/jni
  jni_flutter:
    path: ../../local_packages/jni_flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  # App Store shaffof belgini rad etadi — alfa kanal olib tashlanadi.
  remove_alpha_ios: true
  background_color_ios: "#121212"

flutter:
  uses-material-design: true
  assets:
    # Affitsiant ilovasi logotipi (image/affitsiant.png dan).
    - assets/logo.png
    # "Tayyor" signali. Ilova ochiq turganda push KELMAYDI (OS uni
    # ko'rsatmaydi), shuning uchun ovoz — affitsiantning e'tiborini
    # tortadigan yagona vosita.
    - assets/sound/ready.mp3
