# ┌─ NEGA HAMMA PORT `127.0.0.1:` BILAN ────────────────────────────────┐
# Ilgari bu yerda `- "5432:5432"` yozilgan edi. Docker bunday yozuvni
# `0.0.0.0` deb tushunadi — ya'ni baza BUTUN Wi-Fi TARMOG'IGA ochiladi.
# Kafeda yoki mehmonxonada ishlaganda o'sha tarmoqdagi istalgan odam
# ulanib, ma'lumotni o'qishi va o'zgartirishi mumkin edi.
#
# Ustiga Docker port publishing Windows firewall'ini CHETLAB O'TADI —
# firewall yoqiq bo'lsa ham himoya qilmasdi.
#
# `127.0.0.1:` prefiksi portni faqat shu kompyuterga qoldiradi. Bu
# `superapp.md` dagi INVARIANT 6.18 talabi.
#
# Mobil ilovalar (LAN IP orqali ulanadigan) BAZAGA emas, faqat API'ga
# (:8080) va web'ga (:3000) ulanadi — ular bu o'zgarishdan ta'sirlanmaydi.
# └─────────────────────────────────────────────────────────────────────┘
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: chust
      POSTGRES_PASSWORD: chust_dev_parol
      POSTGRES_DB: chustapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chust -d chustapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # 6379 emas — kompyuterda ALLAQACHON eski, tashlab qo'yilgan Windows
      # Redis xizmati (v3.0.504, ko'p-maydonli HSET'ni qo'llamaydigan)
      # o'sha portni band qilib turibdi (Get-Service "Redis"). Konflikt
      # aniqlangan (jonli sinovda "wrong number of arguments" xatosi orqali
      # topildi) — Docker konteyneri host tomonda 6380'ga chiqariladi.
      - "127.0.0.1:6380:6379"
    # ┌─ NEGA `noeviction`, `allkeys-lru` EMAS ─────────────────────────┐
    # Bu Redis'da IKKI XIL narsa yashaydi: oddiy kesh (restoranlar
    # ro'yxati, 30s) va XAVFSIZLIK belgilari — `revoked:*` (bekor
    # qilingan JWT tokenlar, `internal/revoke`).
    #
    # `allkeys-lru` xotira to'lganda ISTALGAN kalitni chiqarib yuboradi.
    # Agar u `revoked:*` ni chiqarsa, server keyingi restartda uni
    # `load()` bilan topa olmaydi va BEKOR QILINGAN TOKEN YANA AMAL
    # QILA BOSHLAYDI. Ya'ni chiqarib yuborilgan "kesh" aslida jimgina
    # ochilgan sessiya bo'lardi.
    #
    # `noeviction` bilan xotira to'lsa yozuv XATO beradi — bu ko'rinadi
    # va tuzatiladi. Jimgina xavfsizlik teshigidan ko'ra yaxshi.
    #
    # `maxmemory` esa host RAM'ini yeb qo'yishga qarshi oxirgi to'siq
    # (hozirgi haqiqiy sarf ~1 MB, hamma kalitda TTL bor).
    # └─────────────────────────────────────────────────────────────────┘
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]

  mongo:
    image: mongo:7
    ports:
      # 27017 emas — Redis'dagi (6380) bilan AYNAN bir xil sabab:
      # kompyuterda mustaqil Windows MongoDB xizmati bor
      # (E:\MongoDBApp, `Get-Service MongoDB`) va u 27017'ni band qilib
      # turadi. U boshqa loyihalarniki (ShoxPosProLocal, biohacker_ai,
      # safora) — to'xtatib bo'lmaydi.
      #
      # Bu ILGARI JIMGINA MA'LUMOT YO'QOLISHIGA olib kelgan: konteyner
      # portni ololmay qolganda `MONGODB_URI=localhost:27017` Windows
      # xizmatiga ulanardi. U yerda faqat demo seed bor, shuning uchun
      # katalogdagi 4 ta restoran (Avigo, Chust Burger, Feel Food,
      # Shox Resto) va 20 ta mahsulot panelda YO'Q bo'lib ko'rinardi —
      # aslida ular `chustapp_mongodata` volume'ida butun turgan edi.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ┌─ MEILISEARCH — tezkor taom qidiruv (ixtiyoriy) ────────────────────┐
  # `internal/search`. `.env`da `MEILI_HOST` bo'sh bo'lsa API bu
  # konteynerni umuman ishlatmaydi — eski Mongo substring skaneriga
  # qaytadi (R2/Redis/Telegram bilan bir xil falsafa: ixtiyoriy
  # komponent hech qachon serverni to'xtatmaydi).
  #
  # Port boshqa bazalar bilan bir xil sababdan `127.0.0.1:` bilan
  # cheklangan: master-key ochiq tarmoqqa chiqmasligi kerak.
  #
  # `MEILI_MASTER_KEY` gitda YO'Q — `.env`dagi `MEILI_API_KEY` dan olinadi
  # (compose loyiha papkasidagi `.env` ni o'zi o'qiydi). Shu bilan API va
  # konteyner har doim bitta kalitni ishlatadi. Kalit berilmasa konteyner
  # umuman ko'tarilmaydi: master-key'siz Meilisearch hamma uchun ochiq.
  # Production'da kalit faqat sirlar boshqaruvida turadi.
  meilisearch:
    image: getmeili/meilisearch:v1.40.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY:?MEILI_API_KEY .env da berilishi kerak}
      MEILI_ENV: development
      # Ba'zi versiyalarda telemetriyani o'chiradi; tanilmasa e'tiborsiz
      # qoldiriladi (Meilisearch noma'lum o'zgaruvchilarni rad etmaydi).
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data

  # apps/web (Next.js) — mijoz mini-app'lari (WebView/sayt/Telegram) uchun
  # BFF. Go API hozircha konteynerlanmagan (to'g'ridan-to'g'ri hostda
  # ishlaydi), shuning uchun host.docker.internal orqali unga chiqadi.
  web:
    build:
      context: ./apps/web
    environment:
      GO_API_URL: http://host.docker.internal:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      # Bu ATAYLAB `0.0.0.0` da qoladi: mobil ilovalar (Android
      # qurilmasi) web'ga LAN IP orqali ulanadi. Baza portlaridan
      # farqi shu — bu xizmat mijozga mo'ljallangan.
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dbdata:
  mongodata:
  meilidata:
